project:
  seed: 42

env:
  stage: reach
  control_hz: 30
  physics_substeps: 4          # 8 -> 4: ~1.5x faster, contact is still stable at 120 Hz
  episode_steps: 300           # present needs time to reach, grasp, lift AND carry
  success_distance_m: 0.035
  # Reach must ARRIVE AND STOP, so grasp starts from rest.
  reach_settle_qvel: 0.20        # rad/s worst joint; 0.10 was below what it can hold
  reach_settle_speed_mps: 0.05
  reach_settle_s: 0.15
  settle_bonus: 0.25           # pays for slowing down once in tolerance     # 2 cm was tight for a 6-DoF arm under a velocity cap

  # Each stage after reach STARTS from where the frozen earlier stages leave the arm.
  handoff:
    enabled: true
    max_steps: 150             # per prior stage; reach takes 21-80
    retries: 4                 # re-deal the scene if a prior stage fails, then give up loudly
    runs: {reach: runs/feed-reach, grasp: runs/feed-grasp, lift: runs/feed-lift}

  # Control / safety envelope
  action_delta_rad: 0.02
  action_lowpass: 0.35
  max_joint_velocity_rad_s: 1.0
  # joints 1-3 keep real headroom off the stops; the wrist gets most of its range back
  joint_margin_rad:   [0.15, 0.15, 0.15, 0.04, 0.04, 0.03]
  joint_limit_weights: [1.0, 1.0, 1.0, 0.4, 0.4, 0.15]   # roll is nearly free
  min_tcp_radius_m: 0.16      # nothing the task needs lives inside this; curling does
  head_radius_m: 0.18          # virtual wall: TCP never rewarded inside this of the mouth
  staging_m: 0.15              # kept for reference / the IK path
  food_gap_m: 0.05             # where the FOOD should arrive: just short of the lips
  pad_min_distance_m: 0.07     # the jaws may never get closer than this to the mouth
  slow_radius_m: 0.20          # only this close, and only while carrying
  approach_speed_mps: 0.15     # and success requires being under this
  present_tolerance_m: 0.05
  present_hold_s: 0.5

  # Scene randomisation: top-down band from MEASUREMENTS.md, plus per-episode re-sizing
  object_radius_range_m: [0.25, 0.45]
  object_scale_range: [0.75, 1.30]
  object_spacing_m: 0.12       # real setup will not crowd them; do not train on packed scenes
  settle_steps: 40             # let them come to rest before the episode starts
  pad_clearance_m: 0.018       # 4 mm per side vs 17.5 mm perception error was unwinnable
  object_angle_range_rad: [-0.95, 0.95]   # wide enough that the spacing above fits
  home_qpos: [-0.0279, 1.2776, 1.4870, -1.0699, -0.1920, -0.5637]
  # PHASE gates: over the object and at grasp height before closing counts for anything
  align_xy_m: 0.035
  align_z_m: 0.05
  approach_contact_penalty: 0.15   # phase 0 must not touch the object
  open_enough: 0.70            # phase 0 jaws must stay at least this open
  early_close_penalty: 0.15
  time_penalty: 0.05           # finishing beats loitering, decisively
  in_position_bonus: 0.0       # being in position is instrumental, not valuable
  close_bonus: 0.03            # was 0.20: CLOSE out-paid SECURE, so it never pinched
  pinch_bonus: 0.10            # > close_bonus, but small enough that holding it
                               # for a whole episode cannot out-pay succeeding
  knock_free_m: 0.10           # contact under this is approach, not batting
  object_lost_m: 0.45          # past this it is gone: end the episode, do not chase
  object_lost_z: -0.05
  reach_offset_z: 0.035        # reach aims ABOVE the object: a pre-grasp pose
  grasp_hold_s: 0.3            # a grasp has to persist, not flicker for one frame
  grasp_max_displacement_m: 0.04  # beyond this it was batted, not picked up
  lift_height_m: 0.08
  lift_hold_s: 0.5

  # Reward shaping
  # Grip force. HANDOFF.md 8: the sim runs kp=800 (~10 N per pad); the REAL limit is unverified,
  # so these are placeholders to re-check against the arm before trusting any success rate.
  max_grip_force_n: 12.0       # above this a soft object would be crushed
  min_grip_force_n: 2.0        # below this an apple slides out of the jaws
  crush_penalty: 1.5
  grip_band_bonus: 0.05

  grasp_bonus: 0.05
  lift_bonus: 3.0
  carry_bonus: 0.05
  lead_bonus: 0.20             # food ahead of the jaws
  speed_penalty: 2.0
  drop_penalty: 2.0
  self_collision_penalty: 0.5
  curl_penalty: 0.5
  joint_limit_penalty: 0.3
  collision_penalty: 0.2
  knock_penalty: 1.0           # charged once
  lost_penalty: 3.0
  wall_penalty: 1.0
  velocity_penalty: 0.002
  velocity_breach_penalty: 1.0
  jerk_penalty: 0.002
  success_bonus: 50.0          # must dominate per-step term x episode length

training:
  n_envs: 20                   # 20 cores; measured +68% over the 12-env default
  total_timesteps: 3000000
  learning_rate: 0.0003
  n_steps: 512                 # fewer, larger syncs -> less IPC overhead
  batch_size: 512
  gamma: 0.99
  gae_lambda: 0.95
  ent_coef: 0.004              # more exploration than 0.001; reach stalled at 5% before
  policy_layers: [256, 256]
  checkpoint_freq: 10000       # ~2.5 s of progress at risk in a hard crash

# What one fisheye wrist camera plus a table-plane assumption can actually deliver.
# Bias is per-episode (calibration is wrong the same way all run); jitter is per-frame.
# Applied to the OBSERVATION only -- reward and success still use ground truth.
perception_noise:
  enabled: true
  object_bias_m: 0.012      # extrinsics + assumed table height + wide-angle distortion fit
  object_jitter_m: 0.004    # frame-to-frame detection noise
  mouth_bias_m: 0.020       # a face is not on the table plane, so its depth is a weaker estimate
  mouth_jitter_m: 0.008
  reference_range_m: 0.30   # error quoted at this range; scales with distance
  min_scale: 0.25           # never perfect, even at contact
  max_scale: 1.60
  width_rel: 0.10           # pixel extent through an assumed depth: relative, not absolute
